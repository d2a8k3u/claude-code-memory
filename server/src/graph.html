<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Graph</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100vh; overflow: hidden; background: #0d0d0d; color: #e8e6df; font-family: system-ui, sans-serif; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* HUD */
#hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; }
#stats { display: flex; gap: 8px; pointer-events: auto; }
.chip { background: #1a1a1a; border: 0.5px solid #2a2a2a; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #888780; white-space: nowrap; }
.chip b { color: #e8e6df; font-weight: 600; }
#search-wrap { pointer-events: auto; }
#search { background: #1a1a1a; border: 0.5px solid #2a2a2a; border-radius: 6px; padding: 6px 12px; font-size: 13px; color: #e8e6df; outline: none; width: 220px; }
#search:focus { border-color: #444; }
#search::placeholder { color: #555; }

/* Canvas */
#canvas-wrap { flex: 1; position: relative; }
canvas { display: block; width: 100%; height: 100%; }

/* Side panel */
#panel { position: absolute; top: 0; right: 0; bottom: 0; width: 300px; background: #141414; border-left: 0.5px solid #2a2a2a; transform: translateX(100%); transition: transform 0.2s ease; z-index: 20; overflow-y: auto; padding: 20px; }
#panel.open { transform: translateX(0); }
#panel h3 { font-size: 15px; font-weight: 600; margin: 8px 0 4px; line-height: 1.3; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: #fff; margin-bottom: 6px; }
.imp-bar { width: 100%; height: 6px; background: #2a2a2a; border-radius: 3px; margin: 8px 0; }
.imp-fill { height: 100%; border-radius: 3px; }
.meta { font-size: 12px; color: #888780; margin: 4px 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.tag { background: #1a1a1a; border: 0.5px solid #2a2a2a; border-radius: 4px; padding: 2px 6px; font-size: 11px; color: #888780; }
.detail-text { font-size: 13px; line-height: 1.5; color: #ccc; margin-top: 10px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }
.related-list { margin-top: 12px; }
.related-list h4 { font-size: 12px; color: #888780; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.related-item { font-size: 12px; padding: 4px 0; border-bottom: 0.5px solid #1a1a1a; cursor: pointer; }
.related-item:hover { color: #fff; }
.related-rel { color: #555; font-size: 11px; }
.copy-btn { margin-top: 12px; padding: 6px 12px; background: #1a1a1a; border: 0.5px solid #2a2a2a; border-radius: 6px; color: #888780; font-size: 12px; cursor: pointer; }
.copy-btn:hover { border-color: #444; color: #e8e6df; }
#panel-close { position: absolute; top: 12px; right: 12px; background: none; border: none; color: #555; cursor: pointer; font-size: 18px; line-height: 1; }
#panel-close:hover { color: #e8e6df; }

/* Bottom bar */
#bottom { position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: linear-gradient(transparent, #0d0d0d 40%); pointer-events: none; }
#filters { display: flex; gap: 6px; pointer-events: auto; }
.filter-pill { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; opacity: 1; transition: opacity 0.15s; }
.filter-pill.off { opacity: 0.3; }
#legend { display: flex; gap: 12px; margin-left: auto; pointer-events: auto; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #888780; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.legend-line { width: 16px; height: 0; border-top: 2px solid; }
.legend-line.dashed { border-top-style: dashed; }

/* Loading / Empty / Error */
#overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; background: #0d0d0d; }
#overlay.hidden { display: none; }
#overlay-content { text-align: center; }
#overlay-content h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
#overlay-content p { font-size: 14px; color: #888780; margin-bottom: 12px; }
.retry-btn { padding: 6px 16px; background: #1a1a1a; border: 0.5px solid #2a2a2a; border-radius: 6px; color: #e8e6df; font-size: 13px; cursor: pointer; }
.retry-btn:hover { border-color: #444; }
.spinner { width: 24px; height: 24px; border: 2px solid #2a2a2a; border-top-color: #888780; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="stats"></div>
    <div id="search-wrap"><input id="search" type="text" placeholder="Search memories..."></div>
  </div>
  <div id="canvas-wrap"><canvas id="graph"></canvas></div>
  <div id="panel">
    <button id="panel-close">&times;</button>
    <div id="panel-body"></div>
  </div>
  <div id="bottom">
    <div id="filters"></div>
    <div id="legend"></div>
  </div>
  <div id="overlay"><div id="overlay-content"><div class="spinner"></div><h2>Loading memories...</h2></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function() {
  'use strict';

  const TYPE_COLORS = {
    episodic: '#7F77DD',
    semantic: '#1D9E75',
    procedural: '#BA7517',
    pattern: '#D85A30',
    working: '#888780',
  };

  const EDGE_COLORS = {
    relates_to: '#888780',
    depends_on: '#378ADD',
    extends: '#1D9E75',
    implements: '#BA7517',
    contradicts: '#E24B4A',
    derived_from: '#7F77DD',
  };

  const DASHED_EDGES = new Set(['relates_to', 'contradicts']);
  const ARROW_EDGES = new Set(['depends_on', 'extends', 'implements', 'derived_from']);

  let nodes = [];
  let edges = [];
  let simulation = null;
  let selectedNode = null;
  let searchQuery = '';
  let hiddenTypes = new Set();
  let transform = { x: 0, y: 0, k: 1 };
  let lastNodeCount = -1;

  const canvas = document.getElementById('graph');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayContent = document.getElementById('overlay-content');
  const panel = document.getElementById('panel');
  const panelBody = document.getElementById('panel-body');
  const searchInput = document.getElementById('search');

  let W, H;
  let dragNode = null;
  let isPanning = false;
  let panStart = { x: 0, y: 0 };
  let dpr = window.devicePixelRatio || 1;

  function resize() {
    const wrap = document.getElementById('canvas-wrap');
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  new ResizeObserver(resize).observe(document.getElementById('canvas-wrap'));

  function nodeRadius(n) { return 10 + n.importance * 14; }

  function screenToWorld(sx, sy) {
    return { x: (sx - transform.x) / transform.k, y: (sy - transform.y) / transform.k };
  }

  function worldToScreen(wx, wy) {
    return { x: wx * transform.k + transform.x, y: wy * transform.k + transform.y };
  }

  function visibleNodes() { return nodes.filter(n => !hiddenTypes.has(n.type)); }
  function visibleEdges() {
    const ids = new Set(visibleNodes().map(n => n.id));
    return edges.filter(e => ids.has(e.source.id || e.source) && ids.has(e.target.id || e.target));
  }

  function matchesSearch(n) {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return (n.label && n.label.toLowerCase().includes(q)) || (n.detail && n.detail.toLowerCase().includes(q));
  }

  // --- Drawing ---
  function draw() {
    if (!W) return;
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.k, transform.k);

    const vEdges = visibleEdges();
    const vNodes = visibleNodes();

    // Edges
    for (const e of vEdges) {
      const s = e.source, t = e.target;
      if (s.x == null || t.x == null) continue;
      const color = EDGE_COLORS[e.relation] || '#555';
      const dimmed = searchQuery && (!matchesSearch(s) && !matchesSearch(t));
      ctx.globalAlpha = dimmed ? 0.08 : 0.5;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2 / transform.k;

      if (DASHED_EDGES.has(e.relation)) {
        ctx.setLineDash([4 / transform.k, 4 / transform.k]);
      } else {
        ctx.setLineDash([]);
      }

      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(t.x, t.y);
      ctx.stroke();

      // Arrow
      if (ARROW_EDGES.has(e.relation)) {
        const r = nodeRadius(t);
        const dx = t.x - s.x, dy = t.y - s.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 0) {
          const ux = dx / dist, uy = dy / dist;
          const ax = t.x - ux * (r + 2), ay = t.y - uy * (r + 2);
          const aSize = 6 / transform.k;
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(ax - ux * aSize - uy * aSize * 0.5, ay - uy * aSize + ux * aSize * 0.5);
          ctx.lineTo(ax - ux * aSize + uy * aSize * 0.5, ay - uy * aSize - ux * aSize * 0.5);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
        }
      }
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    // Nodes
    for (const n of vNodes) {
      if (n.x == null) continue;
      const r = nodeRadius(n);
      const color = TYPE_COLORS[n.type] || '#888';
      const dimmed = searchQuery && !matchesSearch(n);
      const selected = selectedNode && selectedNode.id === n.id;

      ctx.globalAlpha = dimmed ? 0.15 : 1;

      // Glow ring for selected
      if (selected) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 8, 0, Math.PI * 2);
        ctx.fillStyle = color + '33';
        ctx.fill();
      }

      // Node circle
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = selected ? lighten(color, 0.2) : color;
      ctx.fill();

      // Importance bar
      const barW = r * 1.8;
      const barH = 3;
      const barX = n.x - barW / 2;
      const barY = n.y + r + 4;
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = color;
      ctx.fillRect(barX, barY, barW * n.importance, barH);

      // Label
      const fontSize = Math.max(9, r * 0.42);
      ctx.font = `500 ${fontSize}px system-ui, sans-serif`;
      ctx.fillStyle = dimmed ? '#e8e6df' : '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const words = (n.label || '').split(/\s+/);
      const line1 = words.slice(0, 2).join(' ');
      const line2 = words.slice(2, 4).join(' ');
      const labelY = barY + barH + 3;
      ctx.fillText(line1, n.x, labelY);
      if (line2) ctx.fillText(line2, n.x, labelY + fontSize + 1);
    }

    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.restore();
  }

  function lighten(hex, amt) {
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    r = Math.min(255, r + (255 - r) * amt);
    g = Math.min(255, g + (255 - g) * amt);
    b = Math.min(255, b + (255 - b) * amt);
    return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
  }

  // --- Interactions ---
  function findNodeAt(sx, sy) {
    const { x, y } = screenToWorld(sx, sy);
    const vn = visibleNodes();
    for (let i = vn.length - 1; i >= 0; i--) {
      const n = vn[i];
      const r = nodeRadius(n);
      const dx = n.x - x, dy = n.y - y;
      if (dx * dx + dy * dy < (r + 4) * (r + 4)) return n;
    }
    return null;
  }

  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const hit = findNodeAt(sx, sy);
    if (hit) {
      dragNode = hit;
      hit.fx = hit.x;
      hit.fy = hit.y;
      if (simulation) simulation.alphaTarget(0.1).restart();
    } else {
      isPanning = true;
      panStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    if (dragNode) {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      const { x, y } = screenToWorld(sx, sy);
      dragNode.fx = x;
      dragNode.fy = y;
    } else if (isPanning) {
      transform.x = e.clientX - panStart.x;
      transform.y = e.clientY - panStart.y;
      draw();
    }
  });

  canvas.addEventListener('mouseup', () => {
    if (dragNode) {
      dragNode.fx = null;
      dragNode.fy = null;
      if (simulation) simulation.alphaTarget(0);
      dragNode = null;
    }
    isPanning = false;
  });

  canvas.addEventListener('click', (e) => {
    if (dragNode) return;
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const hit = findNodeAt(sx, sy);
    if (hit) {
      selectedNode = selectedNode && selectedNode.id === hit.id ? null : hit;
    } else {
      selectedNode = null;
    }
    updatePanel();
    draw();
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const oldK = transform.k;
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    transform.k = Math.max(0.4, Math.min(3, transform.k * delta));
    const ratio = transform.k / oldK;
    transform.x = mx - (mx - transform.x) * ratio;
    transform.y = my - (my - transform.y) * ratio;
    draw();
  }, { passive: false });

  canvas.addEventListener('dblclick', () => {
    fitAll();
    draw();
  });

  function fitAll() {
    const vn = visibleNodes();
    if (vn.length === 0) { transform = { x: 0, y: 0, k: 1 }; return; }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of vn) {
      if (n.x == null) continue;
      const r = nodeRadius(n) + 20;
      minX = Math.min(minX, n.x - r);
      minY = Math.min(minY, n.y - r);
      maxX = Math.max(maxX, n.x + r);
      maxY = Math.max(maxY, n.y + r);
    }
    const gw = maxX - minX || 1, gh = maxY - minY || 1;
    const pw = W - 40, ph = H - 80;
    const k = Math.min(pw / gw, ph / gh, 2);
    transform.k = Math.max(0.4, Math.min(3, k));
    transform.x = (W - gw * transform.k) / 2 - minX * transform.k;
    transform.y = (H - gh * transform.k) / 2 - minY * transform.k;
  }

  // --- Search ---
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim();
    draw();
  });

  // --- Panel ---
  document.getElementById('panel-close').addEventListener('click', () => {
    selectedNode = null;
    updatePanel();
    draw();
  });

  function updatePanel() {
    if (!selectedNode) {
      panel.classList.remove('open');
      return;
    }
    panel.classList.add('open');
    const n = selectedNode;
    const color = TYPE_COLORS[n.type] || '#888';

    const relatedEdges = edges.filter(e => {
      const sid = e.source.id || e.source, tid = e.target.id || e.target;
      return sid === n.id || tid === n.id;
    }).slice(0, 5);

    const relatedHtml = relatedEdges.map(e => {
      const sid = e.source.id || e.source, tid = e.target.id || e.target;
      const otherId = sid === n.id ? tid : sid;
      const other = nodes.find(nn => nn.id === otherId);
      if (!other) return '';
      const dir = sid === n.id ? '→' : '←';
      return `<div class="related-item" data-id="${other.id}">${dir} <span class="related-rel">[${e.relation}]</span> ${escHtml(other.label)}</div>`;
    }).join('');

    const created = new Date(n.created_at);
    const dateStr = created.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    const tagsHtml = (n.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');

    panelBody.innerHTML = `
      <div class="badge" style="background:${color}">${n.type}</div>
      <h3>${escHtml(n.label)}</h3>
      <div class="imp-bar"><div class="imp-fill" style="width:${n.importance * 100}%;background:${color}"></div></div>
      <div class="meta">Importance: ${n.importance.toFixed(2)}</div>
      <div class="meta">${dateStr}</div>
      ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ''}
      <div class="detail-text">${escHtml(n.detail)}</div>
      ${relatedHtml ? `<div class="related-list"><h4>Related Memories</h4>${relatedHtml}</div>` : ''}
      <button class="copy-btn" id="copy-prompt">Copy prompt to clipboard</button>
    `;

    document.getElementById('copy-prompt').addEventListener('click', () => {
      const prompt = `Tell me more about this memory: "${n.label}" — ${n.detail}`;
      navigator.clipboard.writeText(prompt).then(() => {
        document.getElementById('copy-prompt').textContent = 'Copied!';
        setTimeout(() => { document.getElementById('copy-prompt').textContent = 'Copy prompt to clipboard'; }, 1500);
      });
    });

    panelBody.querySelectorAll('.related-item').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.id;
        const target = nodes.find(nn => nn.id === id);
        if (target) { selectedNode = target; updatePanel(); draw(); }
      });
    });
  }

  function escHtml(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // --- Stats ---
  function updateStats() {
    const vn = visibleNodes();
    const ve = visibleEdges();
    const avgImp = vn.length ? (vn.reduce((a, n) => a + n.importance, 0) / vn.length).toFixed(2) : '0';
    document.getElementById('stats').innerHTML = `
      <div class="chip"><b>${vn.length}</b> memories</div>
      <div class="chip"><b>${ve.length}</b> links</div>
      <div class="chip">avg <b>${avgImp}</b> importance</div>
    `;
  }

  // --- Filters ---
  function buildFilters() {
    const container = document.getElementById('filters');
    container.innerHTML = '';
    for (const [type, color] of Object.entries(TYPE_COLORS)) {
      const btn = document.createElement('button');
      btn.className = 'filter-pill' + (hiddenTypes.has(type) ? ' off' : '');
      btn.style.background = color;
      btn.style.color = '#fff';
      btn.textContent = type;
      btn.addEventListener('click', () => {
        if (hiddenTypes.has(type)) hiddenTypes.delete(type);
        else hiddenTypes.add(type);
        btn.classList.toggle('off');
        rebuildSimulation();
      });
      container.appendChild(btn);
    }
  }

  function buildLegend() {
    const container = document.getElementById('legend');
    container.innerHTML = '';
    for (const [rel, color] of Object.entries(EDGE_COLORS)) {
      const item = document.createElement('div');
      item.className = 'legend-item';
      const line = document.createElement('div');
      line.className = 'legend-line' + (DASHED_EDGES.has(rel) ? ' dashed' : '');
      line.style.borderColor = color;
      const label = document.createElement('span');
      label.textContent = rel;
      item.appendChild(line);
      item.appendChild(label);
      container.appendChild(item);
    }
  }

  // --- Simulation ---
  function rebuildSimulation() {
    const vn = visibleNodes();
    const ve = visibleEdges();

    if (simulation) simulation.stop();

    simulation = d3.forceSimulation(vn)
      .force('link', d3.forceLink(ve).id(d => d.id)
        .distance(d => 90 + (1 - (d.source.importance + d.target.importance) / 2) * 30)
        .strength(0.4))
      .force('charge', d3.forceManyBody().strength(d => -120 - d.importance * 60))
      .force('center', d3.forceCenter(W / 2, H / 2).strength(0.08))
      .force('collision', d3.forceCollide(d => nodeRadius(d) + 10))
      .alphaDecay(0.025)
      .on('tick', () => { draw(); updateStats(); });
  }

  // --- Data loading ---
  async function loadData() {
    try {
      const res = await fetch('/api/memories');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (data.nodes.length === 0) {
        showEmpty();
        return;
      }

      overlay.classList.add('hidden');

      // Preserve positions of existing nodes
      const oldPositions = {};
      for (const n of nodes) {
        if (n.x != null) oldPositions[n.id] = { x: n.x, y: n.y };
      }

      nodes = data.nodes;
      edges = data.edges;

      for (const n of nodes) {
        if (oldPositions[n.id]) {
          n.x = oldPositions[n.id].x;
          n.y = oldPositions[n.id].y;
        }
      }

      lastNodeCount = nodes.length;
      rebuildSimulation();
      buildFilters();
      updateStats();

      // Fit on first load
      if (Object.keys(oldPositions).length === 0) {
        setTimeout(() => { fitAll(); draw(); }, 600);
      }
    } catch (err) {
      showError(err.message);
    }
  }

  function showEmpty() {
    overlay.classList.remove('hidden');
    overlayContent.innerHTML = `
      <h2>No memories yet</h2>
      <p>Start a session to populate the graph</p>
      <button class="retry-btn" onclick="location.reload()">Refresh</button>
    `;
  }

  function showError(msg) {
    overlay.classList.remove('hidden');
    overlayContent.innerHTML = `
      <h2>Failed to load</h2>
      <p>${escHtml(msg)}</p>
      <button class="retry-btn" onclick="location.reload()">Retry</button>
    `;
  }

  // --- Init ---
  buildLegend();
  resize();
  loadData();

  // Poll every 30s
  setInterval(async () => {
    try {
      const res = await fetch('/api/memories');
      if (!res.ok) return;
      const data = await res.json();
      if (data.nodes.length !== lastNodeCount) {
        loadData();
      }
    } catch { /* ignore */ }
  }, 30000);

})();
</script>
</body>
</html>
